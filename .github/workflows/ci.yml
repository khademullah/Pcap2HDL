name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator libpcap-dev python3
          verilator --version
      - name: Synthetic pcap
        run: python3 scripts/gen_pcap.py ci.pcap
      - name: Replay
        run: make NIC=1 PCAP=ci.pcap MAX_PACKETS=8 BP=2
      - name: Random BP must not drop frames
        run: grep -q "Streamed 7 packets" simulation.log
      - name: NIC RX slave accepted the same frames
        run: grep -q "\\[NIC\\] rx=7  drop=0  byte_mis=0" simulation.log
      - name: Agent BFMs agree with NIC RX
        run: |
          grep -q "\\[AXIS\\] pkts=7" simulation.log
          grep -q "\\[CSR\\] STATUS=7  mis=0" simulation.log
          grep -q "\\[IRQ\\] pulses=7  mis=0" simulation.log
      - name: ARP / VXLAN / IPv6 / VLAN / checksum
        run: |
          grep -q "arp=1" simulation.log
          grep -q "vxlan=1" simulation.log
          grep -q "ipv6=2" simulation.log
          grep -q "vlan=2" simulation.log
          grep -q "CSUM     ok=" simulation.log
          grep -q "mis=0" simulation.log
