name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator libpcap-dev python3
          verilator --version
      - name: Synthetic pcap
        run: python3 scripts/gen_pcap.py ci.pcap
      - name: Replay
        run: make PCAP=ci.pcap MAX_PACKETS=8 BP=2
      - name: Random BP must not drop frames
        run: grep -q "Streamed 4 packets" simulation.log
      - name: ARP / VXLAN / checksum
        run: |
          grep -q "arp=1" simulation.log
          grep -q "vxlan=1" simulation.log
          grep -q "CSUM     ok=" simulation.log
          grep -q "mis=0" simulation.log
